name: Switchale
options:
  bundleIdPrefix: com.aleprieto
  # Única fuente de la versión mínima de macOS: XcodeGen la vuelca en
  # MACOSX_DEPLOYMENT_TARGET y Xcode deriva LSMinimumSystemVersion de ahí.
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Certificado "Apple Development: prietoale@icloud.com" (team WDHDK3HJZ3).
    DEVELOPMENT_TEAM: WDHDK3HJZ3
    # Firma manual con Apple Development (no ad-hoc): los permisos de TCC
    # (Accesibilidad, Grabación de pantalla) quedan atados a esta firma y
    # sobreviven a las recompilaciones.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Apple Development"
    ENABLE_HARDENED_RUNTIME: YES

targets:
  # Núcleo del Window Switcher: Swift puro. No importa AppKit, AX ni CoreGraphics.
  SwitchaleCore:
    type: framework
    platform: macOS
    sources: [Sources/SwitchaleCore]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aleprieto.switchale.core
        GENERATE_INFOPLIST_FILE: YES
        SKIP_INSTALL: YES

  # Tests de Swift Testing; dependen solo del núcleo.
  SwitchaleCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/SwitchaleCoreTests]
    dependencies:
      - target: SwitchaleCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aleprieto.switchale.core.tests
        GENERATE_INFOPLIST_FILE: YES

  Switchale:
    type: application
    platform: macOS
    sources: [Sources/Switchale]
    dependencies:
      - target: SwitchaleCore
    # Las claves del Info.plist viven solo acá; XcodeGen escribe el plist
    # (ignorado por git) al generar el proyecto.
    info:
      path: Sources/Switchale/Info.plist
      properties:
        CFBundleName: switchale
        CFBundleDisplayName: switchale
        CFBundleShortVersionString: "1.1.0"
        CFBundleVersion: "2"
        LSUIElement: true
        NSPrincipalClass: NSApplication
    settings:
      base:
        PRODUCT_NAME: switchale
        PRODUCT_BUNDLE_IDENTIFIER: com.aleprieto.switchale
        # Assets.xcassets/AppIcon lo genera scripts/make-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Switchale:
    build:
      targets:
        Switchale: all
  SwitchaleCore:
    build:
      targets:
        SwitchaleCore: all
    test:
      targets:
        - SwitchaleCoreTests
